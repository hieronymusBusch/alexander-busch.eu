# Static site — Netlify serves the files as they are, no build step.
# (When this folder becomes the repo root, this file replaces the old
# Hugo netlify.toml.)
[build]
  command = ""
  publish = "."

# Old Hugo URLs keep working after the switch.
# Order matters: more specific rules must come first.
[[redirects]]
  from = "/post/links/*"
  to = "/data.html"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/media.html"
  status = 301

[[redirects]]
  from = "/publication/*"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/privacy/*"
  to = "/privacy.html"
  status = 301

# The CV keeps its old path (/uploads/Alexander_Busch_CV.pdf),
# so links in email signatures etc. continue to work unchanged.
