# Static site — Netlify serves the files as they are, no build step.
# The command below is a deliberate no-op: an EMPTY command would make
# Netlify fall back to the legacy Hugo build command still stored in the
# project's UI settings, which fails now that the Hugo files are gone.
[build]
  command = "echo 'Static site - nothing to build'"
  publish = "."

# Old Hugo URLs keep working after the switch.
# Order matters: more specific rules must come first.
[[redirects]]
  from = "/post/links/*"
  to = "/data.html"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/media.html"
  status = 301

[[redirects]]
  from = "/publication/*"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/privacy/*"
  to = "/privacy.html"
  status = 301

# The CV keeps its old path (/uploads/Alexander_Busch_CV.pdf),
# so links in email signatures etc. continue to work unchanged.
